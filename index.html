<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Shapes</title>
    <link rel="stylesheet" href="./styles/main.css?v=0.2.0">
</head>

<body>
<div class="demo-info">
    <a href="./example-extended-buttons.html">example-extended-buttons.html</a>
</div>

<div class="toolbar">
    <!-- Кнопки будут созданы динамически -->
</div>

<div id="canvasWrapper" class="canvas-wrapper">
    <canvas id="canvas"></canvas>

    <div id="info" class="info">
        Кликните Add для создания фигур. Кликните на фигуру для выбора.
    </div>
</div>

<script type="module">
  import { CanvasApp } from './js/app/canvas.app.js?v=0.2.0';
  import { ColorPalette } from './js/models/color-palette.model.js?v=0.2.0';
  import { RectangleFactory } from './js/factories/rectangle.factory.js?v=0.2.0';
  import { ArrowConnectionFactory } from './js/factories/arrow-connection.factory.js?v=0.2.0';
  import { SmartConnectionGenerator } from './js/generators/smart-connection.generator.js?v=0.2.0';
  import { CanvasShapeManager } from './js/managers/canvas-shape.manager.js?v=0.2.0';
  import { CanvasButtonManager } from './js/managers/canvas-button.manager.js?v=0.2.0';
  import { CanvasUIManager } from './js/managers/canvas-ui.manager.js?v=0.2.0';
  import { Canvas2DRenderer } from './js/renderers/canvas-2d.renderer.js?v=0.2.0';
  import { DefaultResizePlugin } from './js/plugins/default-resize.plugin.js?v=0.2.0';
  import { DefaultSelectionPlugin } from './js/plugins/default-selection.plugin.js?v=0.2.0';

  const buttonManager = new CanvasButtonManager();
  const application = new CanvasApp({
    buttonManager,
    shapeManager: new CanvasShapeManager(),
    uiManager: new CanvasUIManager(buttonManager),
    connectionFactory: new ArrowConnectionFactory(),
    connectionGenerator: new SmartConnectionGenerator(),
    renderer: new Canvas2DRenderer(
      document.getElementById('canvasWrapper'),
      document.getElementById('canvas'),
    ),
  });

  application.registerPlugins([
    new DefaultResizePlugin(),
    new DefaultSelectionPlugin(),
  ])

  application.setButtons((app) => /** @type ButtonConfig[] */ [
    {
      id: 'addBtn',
      text: 'Add',
      className: 'button_success',
      action: () => app.addShapes([new RectangleFactory(new ColorPalette())]),
    },
    {
      id: 'deleteBtn',
      text: 'Delete',
      className: 'button_danger',
      isDisabled: ({ selectedShapes }) => !selectedShapes.length,
      action: () => {
        const selectedShapes = app.getSelectedShapes();

        if (!selectedShapes.length) return;

        app.setSelectedShapes([]);
        app.removeShapes(selectedShapes);
      },
    },
    {
      id: 'clearBtn',
      text: 'Clear',
      className: 'button_secondary',
      isDisabled: ({ shapes }) => !shapes.length,
      action: () => app.clearShapes(),
    },
  ]);

  window.addEventListener('load', () => application.run());
</script>
</body>
</html>
