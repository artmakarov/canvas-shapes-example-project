<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Shapes</title>
    <link rel="stylesheet" href="./styles/main.css?v=0.4.0">
</head>

<body>
<div class="demo-info">
    <a href="./example-extended-buttons.html">example-extended-buttons.html</a>
</div>

<div id="toolbar" class="toolbar">
    <!-- Кнопки будут созданы динамически -->
</div>

<div id="canvasWrapper" class="canvas-wrapper">
    <canvas id="canvas"></canvas>

    <div id="info" class="info">
        <!-- Информация будет создана динамически -->
    </div>
</div>

<script type="module">
  import { CanvasApp } from './js/app/canvas.app.js?v=0.4.0';
  import { ColorPalette } from './js/models/color-palette.model.js?v=0.4.0';
  import { RectangleFactory } from './js/factories/rectangle.factory.js?v=0.4.0';
  import { ArrowConnectionFactory } from './js/factories/arrow-connection.factory.js?v=0.4.0';
  import { SmartConnectionGenerator } from './js/generators/smart-connection.generator.js?v=0.4.0';
  import { ShapeManager } from './js/managers/shape.manager.js?v=0.4.0';
  import { ButtonManager } from './js/managers/button.manager.js?v=0.4.0';
  import { UIManager } from './js/managers/ui.manager.js?v=0.4.0';
  import { Canvas2DRenderer } from './js/renderers/canvas-2d.renderer.js?v=0.4.0';
  import { DefaultResizePlugin } from './js/plugins/default-resize.plugin.js?v=0.4.0';
  import { DefaultSelectionPlugin } from './js/plugins/default-selection.plugin.js?v=0.4.0';
  import { EventType } from './js/utils/event-types.js?v=0.4.0';

  const infoContainer = document.querySelector('#info');
  const toolbarContainer = document.querySelector('#toolbar');
  const buttonManager = new ButtonManager(toolbarContainer);
  const application = new CanvasApp({
    buttonManager,
    shapeManager: new ShapeManager(),
    uiManager: new UIManager({ buttonManager }),
    connectionFactory: new ArrowConnectionFactory(),
    connectionGenerator: new SmartConnectionGenerator(),
    renderer: new Canvas2DRenderer(
      document.getElementById('canvasWrapper'),
      document.getElementById('canvas'),
    ),
  });

  application.registerPlugins([
    new DefaultResizePlugin(),
    new DefaultSelectionPlugin(),
  ])

  application.on(EventType.UI_UPDATE, () => {
    const { selectedShapes, shapes } = application.getStateSnapshot();

    if (!infoContainer) return;

    infoContainer.textContent = selectedShapes.length
      ? `Выбрано: ${selectedShapes.map((shape) => shape.name)}`
      : `Фигур: ${shapes.length}. Кликните Add для создания.`;
  })

  application.setButtons((app) => /** @type ButtonConfig[] */ [
    {
      id: 'addBtn',
      text: 'Add',
      className: 'button_success',
      action: () => app.addShapes([new RectangleFactory(new ColorPalette())]),
    },
    {
      id: 'deleteBtn',
      text: 'Delete',
      className: 'button_danger',
      isDisabled: ({ selectedShapes }) => !selectedShapes.length,
      action: () => {
        const selectedShapes = app.getSelectedShapes();

        if (!selectedShapes.length) return;

        app.setSelectedShapes([]);
        app.removeShapes(selectedShapes);
      },
    },
    {
      id: 'clearBtn',
      text: 'Clear',
      className: 'button_secondary',
      isDisabled: ({ shapes }) => !shapes.length,
      action: () => app.clearShapes(),
    },
  ]);

  window.addEventListener('load', () => application.run());
</script>
</body>
</html>
