<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Shapes - Extended Buttons Example</title>
    <link rel="stylesheet" href="./styles/main.css?v=0.3.1">
    <link rel="stylesheet" href="./styles/extended.css?v=0.3.1">
</head>

<body>
<div class="demo-info">
    <h3>Демонстрация гибкой системы кнопок</h3>

    <p>
        Этот пример показывает, как легко добавлять новые кнопки
        без изменения основных классов CanvasUIManager и CanvasApp.
    </p>

    <p><strong>Новые кнопки:</strong></p>

    <ul>
        <li><strong>Randomize</strong> - перемешивает фигуры</li>
        <li><strong>Reset</strong> - сбрасывает все фигуры</li>
        <li><strong>Info</strong> - показывает статистику</li>
    </ul>
</div>

<div id="toolbar" class="toolbar">
    <!-- Кнопки будут созданы динамически -->
</div>

<div id="canvasWrapper" class="canvas-wrapper">
    <canvas id="canvas"></canvas>

    <div id="info" class="info">
        <!-- Информация будет создана динамически -->
    </div>
</div>

<script type="module">
  import { CanvasApp } from './js/app/canvas.app.js?v=0.3.1';
  import { ColorPalette } from './js/models/color-palette.model.js?v=0.3.1';
  import { ContrastColorPalette } from './js/models/contrast-color-palette.model.js?v=0.3.1';
  import { RectangleFactory } from './js/factories/rectangle.factory.js?v=0.3.1';
  import { ArrowConnectionFactory } from './js/factories/arrow-connection.factory.js?v=0.3.1';
  import { SmartConnectionGenerator } from './js/generators/smart-connection.generator.js?v=0.3.1';
  import { ShapeManager } from './js/managers/shape.manager.js?v=0.3.1';
  import { ButtonManager } from './js/managers/button.manager.js?v=0.3.1';
  import { UIManager } from './js/managers/ui.manager.js?v=0.3.1';
  import { Canvas2DRenderer } from './js/renderers/canvas-2d.renderer.js?v=0.3.1';
  import { DefaultResizePlugin } from './js/plugins/default-resize.plugin.js?v=0.3.1';
  import { DefaultSelectionPlugin } from './js/plugins/default-selection.plugin.js?v=0.3.1';

  const infoContainer = document.querySelector('#info');
  const toolbarContainer = document.querySelector('#toolbar');
  const buttonManager = new ButtonManager(toolbarContainer);
  const application = new CanvasApp({
    buttonManager,
    shapeManager: new ShapeManager(),
    uiManager: new UIManager({ buttonManager }),
    connectionFactory: new ArrowConnectionFactory(),
    connectionGenerator: new SmartConnectionGenerator(),
    renderer: new Canvas2DRenderer(
      document.getElementById('canvasWrapper'),
      document.getElementById('canvas'),
    ),
  });

  application.registerPlugins([
    new DefaultResizePlugin(),
    new DefaultSelectionPlugin(),
  ])

  application.onUpdateUI((appStateSnapshot) => {
    const { selectedShapes, shapes } = appStateSnapshot;

    if (!infoContainer) return;

    infoContainer.textContent = selectedShapes.length
      ? `Выбрано: ${selectedShapes.map((shape) => shape.name)}`
      : `Фигур: ${shapes.length}. Кликните Add для создания.`;
  })

  application.setButtons((app) => /** @type ButtonConfig[] */ [
    {
      id: 'addBtn',
      text: 'Add',
      className: 'button_success',
      action: () => app.addShapes([new RectangleFactory(new ContrastColorPalette())]),
    },
    {
      id: 'deleteBtn',
      text: 'Delete',
      className: 'button_danger',
      isDisabled: ({ selectedShapes }) => !selectedShapes.length,
      action: () => {
        const selectedShapes = app.getSelectedShapes();

        if (!selectedShapes.length) return;

        app.setSelectedShapes([]);
        app.removeShapes(selectedShapes);
      },
    },
    {
      id: 'clearBtn',
      text: 'Clear',
      className: 'button_secondary',
      isDisabled: ({ shapes }) => !shapes.length,
      action: () => app.clearShapes(),
    },

    // Новые кнопки
    {
      id: 'randomizeBtn',
      text: 'Randomize',
      className: 'button_warning',
      isDisabled: ({ shapes }) => !shapes.length,
      action: () => {
        const shapes = app.getAllShapes()
        const maxWidth = app.canvas.clientWidth - /* ширина прямоугольника */ 140;
        const maxHeight = app.canvas.clientHeight - /* высота прямоугольника */ 40;

        shapes.forEach((shape) => {
          shape.x = Math.random() * maxWidth;
          shape.y = Math.random() * maxHeight;
        });

        app.render();
      },
    },
    {
      id: 'resetBtn',
      text: 'Reset',
      className: 'button_secondary',
      action: () => {
        app.clearShapes();
        // Создаем 5 фигур
        app.addShapes([
          new RectangleFactory(new ColorPalette()),
          new RectangleFactory(new ContrastColorPalette()),
          new RectangleFactory(new ColorPalette()),
          new RectangleFactory(new ContrastColorPalette()),
          new RectangleFactory(new ColorPalette()),
        ]);
      },
    },
    {
      id: 'infoBtn',
      text: 'Info',
      className: 'button_secondary',
      action: () => {
        const { shapes, selectedShapes } = app.getStateSnapshot();

        let infoText = `Статистика:\n`;
        infoText += `Всего фигур: ${shapes.length}\n`;
        infoText += `Выбрано: ${selectedShapes.length ?? 'Нет'}`;

        alert(infoText);
      },
    },
  ]);

  window.addEventListener('load', () => application.run());
</script>
</body>
</html>
